<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sylvanknits</title>
  <meta name="description" content="sylvanknits offers technical editing for knitting patterns, sample knitting, and test knitting support. Currently on hiatus.">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #202020;
      --text: #d2aaad;
      --muted: #aeacac;
      --accent: #bc5894;
      --accent-hover: #d27aae;
      --panel: #460a2d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: Lato, Arial, Helvetica, sans-serif;
      font-size: 1.125rem;
      line-height: 1.7;
      text-align: center;
    }
    main { width: 100%; max-width: 760px; }
    .logo { display: block; width: 100%; height: auto; margin: 0 auto 40px; }
    p { margin: 0 0 1.25em; }
    .notice {
      margin: 32px auto;
      padding: 24px 28px;
      background: var(--panel);
      border-radius: 6px;
      color: #f0dcdd;
    }
    .notice p:last-child { margin-bottom: 0; }
    .contact { color: var(--muted); font-size: 1rem; }
    a { color: var(--accent); text-decoration: none; font-weight: 700; }
    a:hover, a:focus { color: var(--accent-hover); text-decoration: underline; }
    footer { margin-top: 48px; color: var(--muted); font-size: 0.875rem; }
  </style>
</head>
<body>
  <main>
    <h1 style="margin:0"><img class="logo" src="logo.jpg" alt="sylvanknits" width="1200" height="350"></h1>

    <p>sylvanknits offers technical editing for knitting patterns, sample knitting, and general test knitting support services.</p>

    <div class="notice">
      <p>We are currently on hiatus as we explore new projects and are not accepting new clients. Please check back again in 2027!</p>
    </div>

    <p class="contact">
      <a href="mailto:hello@sylvanknits.com">hello@sylvanknits.com</a>
      &nbsp;·&nbsp;
      <a href="https://www.instagram.com/_sylvant">Instagram</a>
    </p>
  </main>
  <footer>&copy; sylvanknits</footer>
</body>
</html>
